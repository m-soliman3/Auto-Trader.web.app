name: Firebase CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy to Firebase
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular app
        run: npm run build

      - name: Validate auth configuration
        run: |
          has_json="${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOTRADER_B8851 != '' }}"
          has_wif="${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT_EMAIL != '' }}"

          if [[ "$has_json" == "true" && "$has_wif" == "true" ]]; then
            echo "Configure only one auth method: service-account JSON or workload identity federation."
            exit 1
          fi

          if [[ "$has_json" != "true" && "$has_wif" != "true" ]]; then
            echo "Missing auth secrets. Set FIREBASE_SERVICE_ACCOUNT_AUTOTRADER_B8851"
            echo "or set both GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT_EMAIL."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOTRADER_B8851 != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOTRADER_B8851 }}'

      - name: Authenticate to Google Cloud (WIF)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOTRADER_B8851 == '' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT_EMAIL != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}'

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        run: firebase deploy --project autotrader-b8851 --non-interactive --only hosting,functions,firestore:rules
