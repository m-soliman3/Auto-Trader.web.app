  <div class="contact-card">

    <div class="contact-logo">
      <a routerLink="/">
        <svg width="36" height="36" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="#00d17a"/>
          <polyline points="4,22 10,14 16,18 22,8 28,12" stroke="#0d0f14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </a>
    </div>

    <h1>{{ 'contact.title' | translate }}</h1>
    <p class="contact-sub">{{ 'contact.subtitle' | translate }}</p>

    @if (status() === 'success') {
      <div class="alert-success">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
        {{ 'contact.successMsg' | translate }}
      </div>
    }

    @if (status() === 'error') {
      <div class="alert-error">{{ errMsg() }}</div>
    }

    <form (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="email">{{ 'contact.emailLabel' | translate }}</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="senderEmail"
          name="senderEmail"
          [placeholder]="'contact.emailPlaceholder' | translate"
          required
        />
      </div>

      <div class="form-group">
        <label for="subject">{{ 'contact.subjectLabel' | translate }}</label>
        <input
          id="subject"
          type="text"
          [(ngModel)]="subject"
          name="subject"
          [placeholder]="'contact.subjectPlaceholder' | translate"
          required
        />
      </div>

      <div class="form-group">
        <label for="message">{{ 'contact.messageLabel' | translate }}</label>
        <textarea
          id="message"
          [(ngModel)]="message"
          name="message"
          [placeholder]="'contact.messagePlaceholder' | translate"
          rows="6"
          required
        ></textarea>
      </div>

      <button
        type="submit"
        class="btn-submit"
        [disabled]="loading() || !senderEmail || !subject || !message"
      >
        @if (loading()) {
          <span class="spinner"></span> {{ 'contact.sending' | translate }}
        } @else {
          {{ 'contact.sendMessage' | translate }}
        }
      </button>
    </form>

    <p class="contact-alt"><a routerLink="/">{{ 'contact.backToHome' | translate }}</a></p>
  </div>
</div>
