  <div class="contact-card">

    <div class="contact-logo">
      <a routerLink="/">
        <svg width="36" height="36" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="#00d17a"/>
          <polyline points="4,22 10,14 16,18 22,8 28,12" stroke="#0d0f14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </a>
    </div>

    <h1>Get in touch</h1>
    <p class="contact-sub">Have a question or feedback? Send us a message and we'll get back to you.</p>

    @if (status() === 'success') {
      <div class="alert-success">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
        Your message is sent. We will get back to you the soonest possible.
      </div>
    }

    @if (status() === 'error') {
      <div class="alert-error">{{ errMsg() }}</div>
    }

    <form (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="email">Your email address</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="senderEmail"
          name="senderEmail"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input
          id="subject"
          type="text"
          [(ngModel)]="subject"
          name="subject"
          placeholder="What's this about?"
          required
        />
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea
          id="message"
          [(ngModel)]="message"
          name="message"
          placeholder="Write your message here…"
          rows="6"
          required
        ></textarea>
      </div>

      <button
        type="submit"
        class="btn-submit"
        [disabled]="loading() || !senderEmail || !subject || !message"
      >
        @if (loading()) {
          <span class="spinner"></span> Sending…
        } @else {
          Send Message
        }
      </button>
    </form>

    <p class="contact-alt"><a routerLink="/">← Back to home</a></p>
  </div>
</div>
