  <div class="contact-card">

    <div class="contact-logo">
      <a routerLink="/">
        <svg width="36" height="36" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="#00d17a"/>
          <polyline points="4,22 10,14 16,18 22,8 28,12" stroke="#0d0f14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </a>
    </div>

    <h1>{{ 'contact.title' | translate }}</h1>
    <p class="contact-sub">{{ 'contact.subtitle' | translate }}</p>

    <div class="contact-info">
      <div class="contact-info-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c0 6-8 13-8 13S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
        </svg>
        <span>{{ 'contact.address' | translate }}</span>
      </div>
      <div class="contact-info-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
        <a href="mailto:info@investbegin.de">info&#64;investbegin.de</a>
      </div>
    </div>

    <div class="contact-map">
      <iframe
        title="{{ 'contact.mapTitle' | translate }}"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2368.6!2d9.9535!3d53.6195!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47b18f4b9a6e5f9f%3A0x0!2sKapstadt-Ring+7a%2C+22297+Hamburg!5e0!3m2!1sen!2sde!4v1"
        width="100%"
        height="220"
        style="border:0;"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>

    @if (status() === 'success') {
      <div class="alert-success">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
        {{ 'contact.successMsg' | translate }}
      </div>
    }

    @if (status() === 'error') {
      <div class="alert-error">{{ errMsg() }}</div>
    }

    <form (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="email">{{ 'contact.emailLabel' | translate }}</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="senderEmail"
          name="senderEmail"
          [placeholder]="'contact.emailPlaceholder' | translate"
          required
        />
      </div>

      <div class="form-group">
        <label for="subject">{{ 'contact.subjectLabel' | translate }}</label>
        <input
          id="subject"
          type="text"
          [(ngModel)]="subject"
          name="subject"
          [placeholder]="'contact.subjectPlaceholder' | translate"
          required
        />
      </div>

      <div class="form-group">
        <label for="message">{{ 'contact.messageLabel' | translate }}</label>
        <textarea
          id="message"
          [(ngModel)]="message"
          name="message"
          [placeholder]="'contact.messagePlaceholder' | translate"
          rows="6"
          required
        ></textarea>
      </div>

      <button
        type="submit"
        class="btn-submit"
        [disabled]="loading() || !senderEmail || !subject || !message"
      >
        @if (loading()) {
          <span class="spinner"></span> {{ 'contact.sending' | translate }}
        } @else {
          {{ 'contact.sendMessage' | translate }}
        }
      </button>
    </form>

    <p class="contact-alt"><a routerLink="/">{{ 'contact.backToHome' | translate }}</a></p>
  </div>
</div>
