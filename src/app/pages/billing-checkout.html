<div class="checkout-page">
  <div class="checkout-card">
    <header class="checkout-header">
      <h1>Premium Checkout</h1>
      <p>Start your monthly Premium subscription securely inside AutoTrader.</p>
    </header>

    <section class="checkout-summary">
      <div>
        <span class="label">Plan</span>
        <strong>Premium</strong>
      </div>
      <div>
        <span class="label">Price</span>
        <strong>$10 / month</strong>
      </div>
    </section>

    <div class="field-group">
      <label for="cardholder-name">Cardholder name</label>
      <input
        id="cardholder-name"
        type="text"
        [value]="cardholderName()"
        (input)="cardholderName.set($any($event.target).value)"
        placeholder="John Doe"
        autocomplete="cc-name"
      />
    </div>

    <div class="field-group">
      <label for="billing-email">Billing email</label>
      <input
        id="billing-email"
        type="email"
        [value]="billingEmail()"
        (input)="billingEmail.set($any($event.target).value)"
        placeholder="you@example.com"
        autocomplete="email"
      />
    </div>

    <div class="field-group">
      <label>Card details</label>
      <div id="card-element" class="card-element"></div>
    </div>

    @if (statusMessage()) {
      <div class="status ok">{{ statusMessage() }}</div>
    }

    @if (errorMessage()) {
      <div class="status err">{{ errorMessage() }}</div>
    }

    <div class="actions">
      <a routerLink="/settings/billing" class="secondary-btn">Back</a>
      <a routerLink="/billing/manage" class="secondary-btn">Manage billing</a>
      <button
        type="button"
        class="primary-btn"
        (click)="payAndActivatePremium()"
        [disabled]="isInitializing() || isProcessing()"
      >
        {{ isProcessing() ? 'Processing...' : 'Subscribe for $10/month' }}
      </button>
    </div>
  </div>
</div>
